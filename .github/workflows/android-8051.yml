ram[(this.read(0xa0)<<8)|this.r(o&1)]=this.a;n=2;break;\n      case 0xf4:this.a=this.a^255;break;\n      case 0xf5:this.write(this.fetch(),this.a);break;\n      case 0xf6:case 0xf7:this.putIndirect(this.r(o&1),this.a);break;\n      default:throw Error('不支持/保留操作码 0x'+o.toString(16)+'，PC=0x'+address.toString(16));\n    }\n    this.flag(0,this.a.toString(2).replace(/0/g,'').length%2);this.steps++;this.tick(n);this.interrupt();return n;\n  }\n}\n// UART registers intentionally excluded: fail explicitly instead of pretending serial hardware works.\nCPU8051.sfrs=new Set([0x80,0x81,0x82,0x83,0x87,0x88,0x89,0x8a,0x8b,0x8c,0x8d,0x90,0xa0,0xa8,0xb0,0xb8,0xd0,0xe0,0xf0]);\nfunction parseHex(text){\n const code=new Uint8Array(65536),used=new Uint8Array(65536);code.fill(255);let base=0,end=false,count=0;\n const lines=text.replace(/^\\uFEFF/,'').split(/\\r?\\n/);\n for(let i=0;i<lines.length;i++){\n  const s=lines[i].trim();if(!s)continue;const fail=m=>{throw Error('HEX 第 '+(i+1)+' 行：'+m)};\n  if(end)fail('EOF 之后还有数据');if(!/^:(?:[0-9a-fA-F]{2}){5,}$/.test(s))fail('格式错误');\n  const a=s.slice(1).match(/../g).map(x=>parseInt(x,16)),len=a[0],addr=a[1]*256+a[2],type=a[3];\n  if(a.length!==len+5)fail('长度错误');if(a.reduce((x,y)=>x+y,0)%256)fail('校验和错误');\n  if(type===0){for(let j=0;j<len;j++){const p=base+addr+j;if(p>65535)fail('超出 8051 的 64KB 程序空间');if(used[p]&&code[p]!==a[4+j])fail('地址重叠且数据冲突');if(!used[p])count++;used[p]=1;code[p]=a[4+j]}}\n  else if(type===1){if(len!==0)fail('EOF 长度错误');end=true}\n  else if(type===2||type===4){if(len!==2||addr!==0)fail('扩展地址错误');base=(a[4]*256+a[5])*(type===2?16:65536)}\n  else fail('不支持记录类型 '+type+'；仅接受 8051 HEX，不接受 ARM HEX');\n }\n if(!end)throw Error('HEX 缺少 EOF 结束记录');if(!count)throw Error('HEX 没有程序数据');return {code,count};\n}\nif(typeof module!=='undefined')module.exports={CPU8051,parseHex};\n",
          "app/src/main/assets/demo.js": "const DEMO_HEX=\":0F00000074FEF5907E147FFFDFFEDEFA2380F39F\\n:00000001FF\\n\";\nconst TIMER_HEX=\":100000000200300000000000000000B2903200004A\\n:1000100000000000000000000000000000000000E0\\n:1000200000000000000000000000000000000000D0\\n:1000300075890175A882D28C80FE00000000000046\\n:00000001FF\\n\";\n",
          "app/src/main/assets/index.html": "<!doctype html><html lang=\"zh-CN\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>8051 实验台</title><style>\n:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101820;color:#e6edf4}*{box-sizing:border-box}body{margin:0;padding:22px 18px 38px;max-width:750px;margin:auto}h1{font-size:27px;margin:5px 0}h2{font-size:17px;margin-top:0}.tag{font-size:12px;letter-spacing:2px;color:#6ee7b7}.muted{color:#a6b9c8;font-size:13px;line-height:1.7}.card{background:#1b2935;border:1px solid #334451;border-radius:16px;padding:17px;margin:16px 0}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{border:1px solid #4b6172;border-radius:10px;background:#253c4c;color:#fff;padding:11px 13px;font-size:14px}button.primary{background:#6ee7b7;color:#122d24;border-color:#6ee7b7;font-weight:700}button:disabled{opacity:.4}select{max-width:100%}.leds{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:24px 0 12px}.lamp{width:25px;height:25px;border-radius:50%;margin:auto;background:#344c4a;border:2px solid #4c6865}.lamp.on{background:#6ee7b7;border-color:#b2ffe3;box-shadow:0 0 14px #6ee7b770}.pin{text-align:center;font-family:monospace;font-size:11px;color:#afc0ca;margin-top:9px}.chip{padding:13px;text-align:center;letter-spacing:2px;border:2px dashed #547181;border-radius:8px;background:#111e28;color:#bdd0da}#status{font-size:13px;line-height:1.6;overflow-wrap:anywhere;min-height:38px}#regs,#memory{font-family:monospace;font-size:13px;line-height:1.9;white-space:pre-wrap;overflow-wrap:anywhere}.error{color:#ffb4a9}label{font-size:13px}details{margin:15px 0}summary{cursor:pointer}input[type=checkbox]{accent-color:#6ee7b7}#file{display:none}.chipselect{width:100%;margin-top:10px}\n</style></head><body><div class=\"tag\">MCU LAB · 0.2.2 · ST-Link V2</div><h1>8051 实验台</h1><div class=\"muted\">把 Keil C51 程序带到手机上运行</div>\n<div class=\"card\"><h2>STM32F103C8T6 / R4 实物烧录</h2><p class=\"muted\">通过手机 OTG 与 ST-Link V2 连接真实单片机，导入 HEX/BIN 并回读校验。此功能不提供 STM32 仿真。</p><button class=\"primary\" onclick=\"if(window.Android)Android.openProgrammer();else alert('实物烧录需要安装安卓 App')\">打开 ST-Link 烧录器</button></div><div class=\"card\"><label>仿真主控芯片</label><select class=\"chipselect\" id=\"chip\"><option>标准 8051 · 128B RAM · 12T</option></select><p class=\"muted\">首版只开放已实现的标准内核；不包含 STC 扩展外设。</p><div class=\"row\"><button class=\"primary\" id=\"import\">导入 HEX</button><button id=\"demo\">流水灯示例</button><button id=\"timerDemo\">定时器示例</button></div><input id=\"file\" type=\"file\" accept=\".hex,text/plain,application/octet-stream\"><p id=\"status\">选择 HEX，或先加载内置示例。</p></div>\n<div class=\"card\"><div class=\"row\"><h2 style=\"margin:0;flex:1\">LED 实验板</h2><select id=\"port\"><option value=\"144\">P1</option><option value=\"128\">P0</option><option value=\"160\">P2</option><option value=\"176\">P3</option></select></div><div class=\"leds\" id=\"leds\"></div><div class=\"chip\">8051 · PORT → 8 × LED</div><p class=\"muted\">固定数字接线，LED 通过限流电阻接 VCC；默认低电平点亮。此页显示端口逻辑值，不模拟模拟电路。</p><label><input type=\"checkbox\" id=\"activeLow\" checked> 低电平点亮</label></div>\n<div class=\"card\"><div class=\"row\"><button id=\"run\" class=\"primary\">运行</button><button id=\"pause\">暂停</button><button id=\"step\">单步</button><button id=\"reset\">复位</button></div><p class=\"muted\">速度为目标机器周期/秒，用于观察；不是手机实时精度保证。</p><select id=\"speed\"><option value=\"1000\">慢速 · 1,000 周期/秒</option><option value=\"50000\" selected>中速 · 50,000 周期/秒</option><option value=\"1000000\">12MHz 晶振目标 · 1,000,000 周期/秒</option></select><pre id=\"regs\"></pre><details><summary>内部 RAM（00–7F）</summary><pre id=\"memory\"></pre></details></div>\n<details><summary>兼容范围与导入说明</summary><p class=\"muted\">Keil C51 → Options for Target → Output → Create HEX File，重新 Build 后导入 .hex。支持基础指令、4 组寄存器、位操作、64KB 程序空间、逻辑 XRAM、定时器 T0/T1 模式 0/1/2 及两级定时器中断。暂不支持 UART、外部中断、外部计数、定时器模式 3、IDLE/掉电、8052/STC 特有功能、AXF 或 Proteus 工程。中断在指令边界处理，尚未做周期精确认证。切到后台自动暂停。HEX 无芯片型号元数据，请自行确认目标型号。</p></details>\n<script src=\"core.js\"></script><script src=\"demo.js\"></script><script src=\"ui.js\"></script></body></html>\n",
          "app/src/main/assets/ui.js": "'use strict';\nconst cpu=new CPU8051(),$=id=>document.getElementById(id);let running=false,loaded=false,last=0,debt=0,fileName='';\nconst hex=(v,n=2)=>v.toString(16).toUpperCase().padStart(n,'0');\nfunction status(t,error=false){$('status').textContent=t;$('status').className=error?'error':''}\nfunction pause(){running=false;render()}\nfunction render(){\n const port=Number($('port').value),p=cpu.read(port),prefix=$('port').selectedOptions[0].text;\n $('leds').innerHTML=Array.from({length:8},(_,i)=>'<div><div class=\"lamp '+((((p>>i)&1)!==Number($('activeLow').checked))?'on':'')+'\"></div><div class=\"pin\">'+prefix+'.'+i+'</div></div>').join('');\n $('regs').textContent=`${running?'运行中':'已暂停'}  PC ${hex(cpu.pc,4)}  指令 ${cpu.steps}\\nA ${hex(cpu.a)}  B ${hex(cpu.read(0xf0))}  PSW ${hex(cpu.read(0xd0))}\\nSP ${hex(cpu.read(0x81))}  DPTR ${hex(cpu.dptr,4)}  CY ${cpu.c}\\n${Array.from({length:8},(_,i)=>'R'+i+' '+hex(cpu.r(i))).join('  ')}\\nP0 ${hex(cpu.read(128))}  P1 ${hex(cpu.read(144))}  P2 ${hex(cpu.read(160))}  P3 ${hex(cpu.read(176))}\\nT0 ${hex(cpu.read(0x8c))}${hex(cpu.read(0x8a))}  T1 ${hex(cpu.read(0x8d))}${hex(cpu.read(0x8b))}\\n机器周期 ${cpu.cycles}`;\n if($('memory').parentElement.open)$('memory').textContent=Array.from({length:8},(_,r)=>hex(r*16)+': '+Array.from(cpu.ram.slice(r*16,r*16+16)).map(x=>hex(x)).join(' ')).join('\\n');\n $('run').disabled=!loaded||running;$('pause').disabled=!running;$('step').disabled=!loaded||running;$('reset').disabled=!loaded;\n}\nwindow.loadHex=(text,name)=>{pause();try{const parsed=parseHex(text);cpu.code.set(parsed.code);cpu.reset();loaded=true;fileName=name;status(name+' · 已加载 '+parsed.count+' 字节');render()}catch(e){status('导入失败：'+e.message+'。原程序保留。',true)}};\nwindow.importError=m=>status(m,true);window.pauseSimulation=pause;\n$('import').onclick=()=>{pause();if(window.Android)Android.pickHex();else $('file').click()};\n$('file').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>1024*1024)status('文件超过 1MB 上限',true);else loadHex(await f.text(),f.name)}e.target.value=''};\n$('demo').onclick=()=>loadHex(DEMO_HEX,'内置流水灯（手工机器码）');$('timerDemo').onclick=()=>loadHex(TIMER_HEX,'内置 T0 中断闪灯（手工机器码）');\n$('run').onclick=()=>{if(!loaded)return;running=true;last=performance.now();debt=0;status(fileName+' · 运行中');render()};$('pause').onclick=pause;\n$('step').onclick=()=>{try{cpu.step()}catch(e){pause();status(e.message,true)}render()};$('reset').onclick=()=>{pause();cpu.reset();status(fileName+' · 已复位');render()};\n$('port').onchange=render;$('activeLow').onchange=render;document.querySelector('details').ontoggle=render;$('memory').parentElement.ontoggle=render;\nfunction frame(now){if(running){debt+=Math.min(now-last,100)*Number($('speed').value)/1000;const start=performance.now();try{while(debt>0&&performance.now()-start<12){const before=cpu.cycles;cpu.step();debt-=cpu.cycles-before}}catch(e){pause();status(e.message,true)}debt=Math.min(debt,Number($('speed').value)/5);render()}last=now;requestAnimationFrame(frame)}\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});render();requestAnimationFrame(frame);\n",
          "app/src/main/java/cn/lei/sim8051/AndroidStLinkUsb.java": "package cn.lei.sim8051;\nimport android.hardware.usb.*;\npublic final class AndroidStLinkUsb implements StLinkProtocol.Transport,AutoCloseable {\n private final UsbDeviceConnection connection;private final UsbInterface face;private final UsbEndpoint in,out;private volatile boolean closed;\n public AndroidStLinkUsb(UsbManager manager,UsbDevice device)throws Exception{\n  UsbInterface chosen=null;UsbEndpoint input=null,output=null;\n  for(int i=0;i<device.getInterfaceCount();i++){UsbInterface f=device.getInterface(i);UsbEndpoint a=null,b=null;for(int j=0;j<f.getEndpointCount();j++){UsbEndpoint e=f.getEndpoint(j);if(e.getType()!=UsbConstants.USB_ENDPOINT_XFER_BULK)continue;if(e.getAddress()==0x81)a=e;if(e.getAddress()==0x02)b=e;}if(a!=null&&b!=null){chosen=f;input=a;output=b;break;}}\n  if(chosen==null)throw new Exception(\"找不到 V2 的 USB bulk 端点 0x81/0x02\");\n  UsbDeviceConnection c=manager.openDevice(device);if(c==null)throw new Exception(\"USB 未授权或设备已断开\");if(!c.claimInterface(chosen,true)){c.close();throw new Exception(\"USB 接口被占用，请关闭其他烧录应用\");}\n  connection=c;face=chosen;in=input;out=output;\n }\n @Override public void send(byte[] b)throws Exception{if(closed)throw new Exception(\"USB 已断开\");int n=connection.bulkTransfer(out,b,b.length,3000);if(n!=b.length)throw new Exception(\"USB 写入超时/短传输（\"+n+\"/\"+b.length+\"），请重新连接\");}\n @Override public byte[] receive(int size)throws Exception{if(closed)throw new Exception(\"USB 已断开\");byte[] b=new byte[size];int n=connection.bulkTransfer(in,b,size,3000);if(n!=size)throw new Exception(\"USB 读取超时/短传输（\"+n+\"/\"+size+\"），请重新连接\");return b;}\n @Override public void close(){if(!closed){closed=true;connection.releaseInterface(face);connection.close();}}\n}\n",
          "app/src/main/java/cn/lei/sim8051/ChipTarget.java": "package cn.lei.sim8051;\n/** Explicit target profiles; ID alone cannot determine exact model/package. */\npublic enum ChipTarget {\n R4(\"STM32F103R4\",0x412,16*1024,6*1024),\n C8(\"STM32F103C8T6\",0x410,64*1024,20*1024);\n public final String label;public final int deviceId,flashSize,ramSize;\n ChipTarget(String label,int id,int flash,int ram){this.label=label;deviceId=id;flashSize=flash;ramSize=ram;}\n @Override public String toString(){return label+\" · \"+flashSize/1024+\"KB Flash · \"+ramSize/1024+\"KB RAM\";}\n}\n",
          "app/src/main/java/cn/lei/sim8051/F103Programmer.java": "package cn.lei.sim8051;\nimport java.util.*;\npublic final class F103Programmer {\n public interface Monitor {boolean cancelled();void progress(String stage,int percent);}\n private final StLinkProtocol link;\n public static final int DHCSR=0xe000edf0,DEMCR=0xe000edfc,AIRCR=0xe000ed0c;\n public static final int FLASH=0x40022000,SR=FLASH+12,CR=FLASH+16;\n public F103Programmer(StLinkProtocol l){link=l;}\n public String identify()throws Exception{return identify(ChipTarget.R4);}\n public String identify(ChipTarget target)throws Exception{\n  int id=link.read32(0xe0042000)&0xfff,cpuid=link.read32(0xe000ed00),kb=link.read32(0x1ffff7e0)&65535;\n  if(id!=target.deviceId||kb!=target.flashSize/1024||((cpuid>>>4)&0xfff)!=0xc23)throw new Exception(String.format(Locale.ROOT,\"目标不匹配：ID=%03X，Flash=%dKB；当前选择 %s（ID=%03X，%dKB）\",id,kb,target.label,target.deviceId,target.flashSize/1024));\n  if((link.read32(FLASH+28)&2)!=0)throw new Exception(\"芯片已开启读保护，停止操作；本版不会解除保护或修改选项字节\");\n  return String.format(Locale.ROOT,\"F1 Cortex-M3 · ID 0x%03X · Flash %dKB（请核对丝印为 %s）\",id,kb,target.label);\n }\n private void cancelled(Monitor m)throws Exception{if(m.cancelled())throw new Exception(\"已停止；Flash 可能已部分修改，请重新完整烧录后使用\");}\n private void waitBits(int addr,int mask,int expect,long timeout)throws Exception{long end=System.nanoTime()+timeout*1000000L;do{if((link.read32(addr)&mask)==expect)return;Thread.sleep(2);}while(System.nanoTime()<end);throw new Exception(\"目标响应超时，寄存器 0x\"+Integer.toHexString(addr));}\n private void flashReady(long timeout)throws Exception{waitBits(SR,1,0,timeout);int s=link.read32(SR);if((s&0x14)!=0)throw new Exception(\"Flash 操作失败，SR=0x\"+Integer.toHexString(s)+\"（检查写保护/供电）\");}\n private void halt()throws Exception{link.write32(DHCSR,0xa05f0003);waitBits(DHCSR,1<<17,1<<17,1000);}\n public void program(FirmwareImage image,Monitor m)throws Exception{\n  cancelled(m);identify(image.target);int oldDemcr=0;boolean saved=false,halted=false,unlocked=false,completed=false;\n  try{\n   halt();halted=true;oldDemcr=link.read32(DEMCR);saved=true;link.write32(DEMCR,oldDemcr|1);\n   link.write32(AIRCR,0x05fa0004);waitBits(DHCSR,1<<17,1<<17,1500); // vector-catch reset halts before application executes\n   link.write32(DEMCR,oldDemcr&~1);halt();\n   link.write32(0xe0042004,link.read32(0xe0042004)|0x300); // freeze watchdogs while core halted\n   identify(image.target);link.write32(0x40021000,link.read32(0x40021000)|1);waitBits(0x40021000,2,2,1000); // HSI required by FPEC\n   flashReady(2000);link.write32(SR,0x34);\n   if((link.read32(CR)&128)!=0){link.write32(FLASH+4,0x45670123);link.write32(FLASH+4,0xcdef89ab);}\n   if((link.read32(CR)&128)!=0)throw new Exception(\"Flash 未解锁\");unlocked=true;\n   int count=image.pageCount(),done=0;\n   for(int p=0;p<image.pages.length;p++)if(image.pages[p]){\n    cancelled(m);int addr=FirmwareImage.BASE+p*1024;link.write32(SR,0x34);link.write32(CR,2);link.write32(FLASH+20,addr);link.write32(CR,0x42);flashReady(3000);link.write32(CR,0);\n    byte[] erased=link.read(addr,1024);for(byte v:erased)if((v&255)!=255)throw new Exception(\"擦除校验失败：0x\"+Integer.toHexString(addr));\n    m.progress(\"擦除\",(++done)*20/count);\n   }\n   link.write32(CR,1);int total=count*1024,processed=0,last=-1;\n   for(int p=0;p<image.pages.length;p++)if(image.pages[p])for(int i=p*1024;i<(p+1)*1024;i+=2){\n    cancelled(m);int v=(image.data[i]&255)|((image.data[i+1]&255)<<8);\n    if(v!=65535){link.writeHalf(FirmwareImage.BASE+i,v);flashReady(1000);}\n    processed+=2;int pc=20+processed*60/total;if(pc!=last){m.progress(\"写入\",pc);last=pc;}\n   }\n   link.write32(CR,0);done=0;\n   for(int p=0;p<image.pages.length;p++)if(image.pages[p]){cancelled(m);int addr=FirmwareImage.BASE+p*1024;byte[] r=link.read(addr,1024);for(int i=0;i<1024;i++)if(r[i]!=image.data[p*1024+i])throw new Exception(\"回读校验失败：0x\"+Integer.toHexString(addr+i));m.progress(\"回读校验\",80+(++done)*19/count);}\n   completed=true;\n  }finally{\n   // Never boot a partially programmed image. Best effort cleanup while preserving original error.\n   if(unlocked)try{link.write32(CR,128);}catch(Exception ignored){}\n   if(saved)try{link.write32(DEMCR,oldDemcr);}catch(Exception ignored){}\n   if(!completed&&halted)try{halt();}catch(Exception ignored){}\n  }\n  // A verified image is reset, then the debug connection is released so it can run.\n  link.write32(DEMCR,oldDemcr&~1);link.write32(DHCSR,0xa05f0001);link.write32(AIRCR,0x05fa0004);link.exit();m.progress(\"校验通过，已发送复位运行命令\",100);\n }\n}\n",
          "app/src/main/java/cn/lei/sim8051/FirmwareImage.java": "package cn.lei.sim8051;\nimport java.nio.charset.StandardCharsets;\nimport java.util.*;\n/** Standard application image only: reset vectors at 08000000, no option bytes. */\npublic final class FirmwareImage {\n public static final int BASE=0x08000000,SIZE=16*1024,PAGE=1024;\n public final byte[] data;public final boolean[] present,pages;public final int bytes;public final ChipTarget target;\n private FirmwareImage(byte[] d,boolean[] used,ChipTarget target)throws Exception{this.target=target;data=d;present=used;pages=new boolean[target.flashSize/PAGE];int n=0;for(int i=0;i<d.length;i++)if(used[i]){n++;pages[i/PAGE]=true;}bytes=n;validate();}\n public static FirmwareImage parse(byte[] input,String name)throws Exception{\n  return parse(input,name,ChipTarget.R4);\n }\n public static FirmwareImage parse(byte[] input,String name,ChipTarget target)throws Exception{\n  int size=target.flashSize;byte[] out=new byte[size];Arrays.fill(out,(byte)255);boolean[] used=new boolean[size];\n  if(name.toLowerCase(Locale.ROOT).endsWith(\".bin\")){\n   if(input.length<8||input.length>size)throw new Exception(\"BIN 必须为 8～\"+size+\" 字节，起始地址固定 0x08000000\");\n   System.arraycopy(input,0,out,0,input.length);Arrays.fill(used,0,input.length,true);\n  }else if(name.toLowerCase(Locale.ROOT).endsWith(\".hex\")){\n   String text=new String(input,StandardCharsets.UTF_8).replaceFirst(\"^\\\\uFEFF\",\"\");long base=0;boolean eof=false;int lineNo=0;\n   for(String line:text.split(\"\\\\r?\\\\n\")){\n    lineNo++;String s=line.trim();if(s.isEmpty())continue;String prefix=\"HEX 第 \"+lineNo+\" 行：\";\n    if(eof)throw new Exception(prefix+\"EOF 后有记录\");if(!s.matches(\":(?:[0-9a-fA-F]{2}){5,}\"))throw new Exception(prefix+\"格式错误\");\n    int[] b=new int[(s.length()-1)/2];int sum=0;for(int i=0;i<b.length;i++){b[i]=Integer.parseInt(s.substring(1+2*i,3+2*i),16);sum+=b[i];}\n    int len=b[0],address=(b[1]<<8)|b[2],type=b[3];if(b.length!=len+5)throw new Exception(prefix+\"长度错误\");if((sum&255)!=0)throw new Exception(prefix+\"校验和错误\");\n    if(type==0){for(int i=0;i<len;i++){long absolute=base+address+i;if(absolute<BASE||absolute>=BASE+size)throw new Exception(prefix+\"地址超出 \"+target.label+\" 的 Flash（08000000～\"+Integer.toHexString(BASE+size-1)+\"）\");int p=(int)(absolute-BASE);if(used[p]&&(out[p]&255)!=b[4+i])throw new Exception(prefix+\"地址冲突\");out[p]=(byte)b[4+i];used[p]=true;}}\n    else if(type==1){if(len!=0||address!=0)throw new Exception(prefix+\"EOF 错误\");eof=true;}\n    else if(type==2||type==4){if(len!=2||address!=0)throw new Exception(prefix+\"扩展地址错误\");base=((b[4]<<8)|b[5])*(type==2?16L:65536L);}\n    else if(type==3||type==5){if(len!=4||address!=0)throw new Exception(prefix+\"启动地址记录错误\");/* reset uses vector, not HEX start address */}\n    else throw new Exception(prefix+\"不支持记录类型 \"+type);\n   }\n   if(!eof)throw new Exception(\"HEX 缺少 EOF\");\n  }else throw new Exception(\"请选择 .hex 或 .bin，暂不接受 AXF/ELF\");\n  return new FirmwareImage(out,used,target);\n }\n private void validate()throws Exception{\n  for(int i=0;i<8;i++)if(!present[i])throw new Exception(\"缺少 0x08000000 处的完整启动向量；本版只烧录独立应用\");\n  long sp=u32(data,0),entry=u32(data,4),pc=entry&~1L;\n  if(sp<0x20000008L||sp>0x20000000L+target.ramSize||(sp&3)!=0)throw new Exception(\"初始栈地址不符合 \"+target.label+\" 的 \"+target.ramSize/1024+\"KB SRAM；请检查 Keil 目标配置\");\n  if((entry&1)==0||pc<BASE||pc>=BASE+data.length||!present[(int)(pc-BASE)])throw new Exception(\"复位入口无效或未包含入口代码，请检查目标型号及 Flash 地址\");\n }\n public int pageCount(){int n=0;for(boolean p:pages)if(p)n++;return n;}\n public static long u32(byte[] b,int at){return (b[at]&255L)|((b[at+1]&255L)<<8)|((b[at+2]&255L)<<16)|((b[at+3]&255L)<<24);}\n}\n",
          "app/src/main/java/cn/lei/sim8051/MainActivity.java": "package cn.lei.sim8051;\nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.content.Intent;\nimport android.database.Cursor;\nimport android.provider.OpenableColumns;\nimport android.webkit.*;\nimport android.net.Uri;\nimport java.io.*;\nimport org.json.JSONObject;\npublic class MainActivity extends Activity {\n private WebView web;\n @Override public void onCreate(Bundle state){super.onCreate(state);web=new WebView(this);web.setOnApplyWindowInsetsListener((v,insets)->{v.setPadding(insets.getSystemWindowInsetLeft(),insets.getSystemWindowInsetTop(),insets.getSystemWindowInsetRight(),insets.getSystemWindowInsetBottom());return insets;});setContentView(web);web.getSettings().setJavaScriptEnabled(true);web.getSettings().setAllowFileAccess(false);web.getSettings().setAllowContentAccess(false);web.getSettings().setDomStorageEnabled(false);web.setWebViewClient(new WebViewClient(){\n  @Override public WebResourceResponse shouldInterceptRequest(WebView v,WebResourceRequest r){String p=r.getUrl().getPath();if(\"https\".equals(r.getUrl().getScheme())&&\"appassets.androidplatform.net\".equals(r.getUrl().getHost())&&p!=null&&p.matches(\"/[a-zA-Z0-9_.-]+\")){try{return new WebResourceResponse(p.endsWith(\".html\")?\"text/html\":\"text/javascript\",\"UTF-8\",getAssets().open(p.substring(1)));}catch(IOException e){}}\n   return new WebResourceResponse(\"text/plain\",\"UTF-8\",new ByteArrayInputStream(new byte[0]));}\n  @Override public boolean shouldOverrideUrlLoading(WebView v,WebResourceRequest r){return true;}\n });web.addJavascriptInterface(new Bridge(),\"Android\");web.loadUrl(\"https://appassets.androidplatform.net/index.html\");}\n public class Bridge {@JavascriptInterface public void openProgrammer(){runOnUiThread(()->startActivity(new Intent(MainActivity.this,ProgrammerActivity.class)));}@JavascriptInterface public void pickHex(){runOnUiThread(()->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType(\"*/*\");startActivityForResult(i,41);});}}\n @Override protected void onActivityResult(int request,int result,Intent data){super.onActivityResult(request,result,data);if(request!=41||result!=RESULT_OK||data==null||data.getData()==null)return;Uri uri=data.getData();new Thread(()->{try{String name=\"program.hex\";try(Cursor c=getContentResolver().query(uri,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null)){if(c!=null&&c.moveToFirst())name=c.getString(0);}ByteArrayOutputStream bytes=new ByteArrayOutputStream();try(InputStream in=getContentResolver().openInputStream(uri)){if(in==null)throw new IOException(\"无法打开文件\");byte[] buffer=new byte[8192];int n;while((n=in.read(buffer))!=-1){if(bytes.size()+n>1048576)throw new IOException(\"文件超过 1MB\");bytes.write(buffer,0,n);}}String js=\"loadHex(\"+JSONObject.quote(bytes.toString(\"UTF-8\"))+\",\"+JSONObject.quote(name)+\")\";runOnUiThread(()->web.evaluateJavascript(js,null));}catch(Exception e){runOnUiThread(()->web.evaluateJavascript(\"importError(\"+JSONObject.quote(\"读取失败：\"+e.getMessage())+\")\",null));}}).start();}\n @Override protected void onPause(){if(web!=null){web.evaluateJavascript(\"window.pauseSimulation&&pauseSimulation()\",null);web.onPause();}super.onPause();}\n @Override protected void onResume(){super.onResume();if(web!=null)web.onResume();}\n @Override protected void onDestroy(){if(web!=null){web.removeJavascriptInterface(\"Android\");web.destroy();}super.onDestroy();}\n}\n",
          "app/src/main/java/cn/lei/sim8051/ProgrammerActivity.java": "package cn.lei.sim8051;\nimport android.app.*;\nimport android.os.*;\nimport android.content.*;\nimport android.database.Cursor;\nimport android.hardware.usb.*;\nimport android.net.Uri;\nimport android.provider.OpenableColumns;\nimport android.view.*;\nimport android.widget.*;\nimport java.io.*;\nimport java.util.*;\nimport java.util.concurrent.*;\nimport java.util.concurrent.atomic.AtomicBoolean;\npublic class ProgrammerActivity extends Activity {\n private UsbManager manager;private final ExecutorService worker=Executors.newSingleThreadExecutor();private final AtomicBoolean stop=new AtomicBoolean();\n private volatile AndroidStLinkUsb usb;private volatile StLinkProtocol link;private FirmwareImage firmware;private String filename=\"\";private UsbDevice chosen;\n private ChipTarget target=ChipTarget.C8;private Spinner targetPicker;private Button connect,choose,burn,cancel;private TextView fileInfo,deviceInfo,status,log;private ProgressBar progress;private boolean busy,registered,destroyed;\n private String action(){return getPackageName()+\".STLINK_USB_PERMISSION\";}\n private final BroadcastReceiver receiver=new BroadcastReceiver(){@Override public void onReceive(Context context,Intent intent){\n  if(action().equals(intent.getAction())){if(intent.getBooleanExtra(UsbManager.EXTRA_PERMISSION_GRANTED,false)&&chosen!=null&&manager.hasPermission(chosen))connectChosen();else{busy=false;status.setText(\"USB 权限未授予\");refresh();}}\n  else if(UsbManager.ACTION_USB_DEVICE_DETACHED.equals(intent.getAction())){UsbDevice d=intent.getParcelableExtra(UsbManager.EXTRA_DEVICE);if(chosen!=null&&d!=null&&chosen.getDeviceId()==d.getDeviceId()){stop.set(true);closeUsb();deviceInfo.setText(\"ST-Link 已拔出\");status.setText(\"设备断开；若烧录被中断，请重新完整烧录\");refresh();}}\n }};\n @Override public void onCreate(Bundle saved){super.onCreate(saved);manager=(UsbManager)getSystemService(USB_SERVICE);\n  ScrollView scroll=new ScrollView(this);LinearLayout root=new LinearLayout(this);root.setOrientation(LinearLayout.VERTICAL);int pad=(int)(20*getResources().getDisplayMetrics().density);root.setPadding(pad,pad,pad,pad);scroll.addView(root);scroll.setOnApplyWindowInsetsListener((v,insets)->{v.setPadding(insets.getSystemWindowInsetLeft(),insets.getSystemWindowInsetTop(),insets.getSystemWindowInsetRight(),insets.getSystemWindowInsetBottom());return insets;});setContentView(scroll);\n  text(root,\"STM32 实物烧录\",25);text(root,\"选择实物芯片 · ST-Link V2\",16);\n  targetPicker=new Spinner(this);ChipTarget[] targets={ChipTarget.C8,ChipTarget.R4};ArrayAdapter<ChipTarget> adapter=new ArrayAdapter<>(this,android.R.layout.simple_spinner_item,targets);adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);targetPicker.setAdapter(adapter);root.addView(targetPicker);\n  targetPicker.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener(){public void onNothingSelected(AdapterView<?> parent){}public void onItemSelected(AdapterView<?> parent,View view,int pos,long id){ChipTarget next=targets[pos];if(next==target)return;target=next;closeUsb();firmware=null;filename=\"\";fileInfo.setText(\"型号已切换，请重新导入文件\");deviceInfo.setText(\"请重新连接目标芯片\");status.setText(\"当前目标：\"+target.label);refresh();}});\n  text(root,\"手机 USB-C OTG → ST-Link V2 → SWDIO / SWCLK / GND。目标板使用 3.3V；按下载器说明接电压参考或供电。BOOT0 保持 0。\",15);\n  deviceInfo=text(root,\"尚未连接下载器\",16);connect=button(root,\"查找并连接 ST-Link V2\",v->scan());\n  fileInfo=text(root,\"请选择 Keil 生成的 HEX 或 BIN\",16);choose=button(root,\"选择 HEX / BIN\",v->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.addCategory(Intent.CATEGORY_OPENABLE);i.setType(\"*/*\");startActivityForResult(i,82);});\n  burn=button(root,\"烧录并回读校验\",v->confirm());cancel=button(root,\"停止烧录\",v->{stop.set(true);status.setText(\"正在停止；当前硬件操作结束后会暂停\");});\n  progress=new ProgressBar(this,null,android.R.attr.progressBarStyleHorizontal);progress.setMax(100);root.addView(progress);status=text(root,\"准备就绪\",16);\n  text(root,\"只擦除文件涉及的 1KB 页；这些页内未包含在文件中的字节将变成 FF。选项字节、读保护设置不会修改。当前没有 STM32 软件仿真功能。\",14);\n  text(root,\"连接失败时先检查 OTG、供电、SWD 接线和下载器固件。板子的实际封装/型号无法单靠芯片 ID 确认，请核对丝印。\",14);\n  log=text(root,\"\",13);log.setTextIsSelectable(true);\n  IntentFilter f=new IntentFilter(action());f.addAction(UsbManager.ACTION_USB_DEVICE_DETACHED);if(Build.VERSION.SDK_INT>=33)registerReceiver(receiver,f,Context.RECEIVER_NOT_EXPORTED);else registerReceiver(receiver,f);registered=true;refresh();\n }\n private TextView text(LinearLayout root,String value,int size){TextView t=new TextView(this);t.setText(value);t.setTextSize(size);t.setPadding(0,12,0,12);root.addView(t);return t;}\n private Button button(LinearLayout root,String label,View.OnClickListener click){Button b=new Button(this);b.setText(label);b.setOnClickListener(click);root.addView(b);return b;}\n private void refresh(){targetPicker.setEnabled(!busy);connect.setEnabled(!busy);choose.setEnabled(!busy);burn.setEnabled(!busy&&firmware!=null&&link!=null);cancel.setEnabled(busy&&link!=null);}\n private void append(String s){log.append(s+\"\\n\");}\n private void ui(Runnable r){runOnUiThread(()->{if(!destroyed)r.run();});}\n private void closeUsb(){link=null;AndroidStLinkUsb old=usb;usb=null;if(old!=null)old.close();}\n private void scan(){if(busy)return;closeUsb();List<UsbDevice> devices=new ArrayList<>();for(UsbDevice d:manager.getDeviceList().values())if(d.getVendorId()==0x0483&&d.getProductId()==0x3748)devices.add(d);\n  if(devices.isEmpty()){status.setText(\"未找到独立 ST-Link V2（0483:3748）。检查 OTG 和 USB 线；本版不支持 V1/V2-1/V3。\");return;}\n  if(devices.size()==1)request(devices.get(0));else{String[] names=new String[devices.size()];for(int i=0;i<names.length;i++)names[i]=devices.get(i).getDeviceName();new AlertDialog.Builder(this).setTitle(\"选择下载器\").setItems(names,(d,i)->request(devices.get(i))).show();}\n }\n private void request(UsbDevice d){chosen=d;busy=true;refresh();status.setText(\"等待 USB 授权\");if(manager.hasPermission(d)){connectChosen();return;}Intent i=new Intent(action());i.setPackage(getPackageName());PendingIntent p=PendingIntent.getBroadcast(this,0,i,PendingIntent.FLAG_UPDATE_CURRENT|PendingIntent.FLAG_IMMUTABLE);try{manager.requestPermission(d,p);}catch(Exception e){busy=false;status.setText(e.getMessage());refresh();}}\n private void connectChosen(){status.setText(\"连接并检查目标…\");stop.set(false);worker.execute(()->{try{AndroidStLinkUsb transport=new AndroidStLinkUsb(manager,chosen);usb=transport;StLinkProtocol p=new StLinkProtocol(transport);p.open();String found=new F103Programmer(p).identify(target);if(stop.get())throw new Exception(\"设备已断开\");link=p;ui(()->{deviceInfo.setText(\"ST-Link \"+p.version+\"\\n\"+p.startup+\"\\n\"+found);status.setText(\"已连接；识别过程未擦除 Flash\");append(\"连接成功：\"+p.version+\" · \"+p.startup);});}catch(Exception e){closeUsb();ui(()->{deviceInfo.setText(\"未连接\");status.setText(\"连接失败：\"+e.getMessage());append(\"连接失败：\"+e.getMessage());});}finally{ui(()->{busy=false;refresh();});}});}\n @Override protected void onActivityResult(int req,int result,Intent data){super.onActivityResult(req,result,data);if(req!=82||result!=RESULT_OK||data==null||data.getData()==null)return;Uri uri=data.getData();busy=true;refresh();worker.execute(()->{try{String name=\"\";try(Cursor c=getContentResolver().query(uri,new String[]{OpenableColumns.DISPLAY_NAME},null,null,null)){if(c!=null&&c.moveToFirst())name=c.getString(0);}if(name==null||name.isEmpty())throw new Exception(\"文件名不可读取\");ByteArrayOutputStream b=new ByteArrayOutputStream();try(InputStream in=getContentResolver().openInputStream(uri)){if(in==null)throw new Exception(\"文件无法读取\");byte[] chunk=new byte[8192];int n;while((n=in.read(chunk))!=-1){if(b.size()+n>1048576)throw new Exception(\"文件超过 1MB\");b.write(chunk,0,n);}}FirmwareImage f=FirmwareImage.parse(b.toByteArray(),name,target);String n=name;ui(()->{firmware=f;filename=n;fileInfo.setText(n+\"\\n有效数据 \"+f.bytes+\" 字节；涉及 \"+f.pageCount()+\" 页；起始地址 0x08000000\");status.setText(\"文件检查通过\");});}catch(Exception e){ui(()->{firmware=null;filename=\"\";fileInfo.setText(\"文件无效\");status.setText(e.getMessage());});}finally{ui(()->{busy=false;refresh();});}});}\n private void confirm(){if(firmware==null||link==null||busy)return;new AlertDialog.Builder(this).setTitle(\"写入真实单片机\").setMessage(\"文件：\"+filename+\"\\n目标：\"+target.label+\"\\n将擦除文件涉及的 \"+firmware.pageCount()+\" 个 1KB 页，再写入和回读校验。页内旧数据会被替换。\\n烧录期间请保持供电和连接。\").setNegativeButton(\"取消\",null).setPositiveButton(\"开始烧录\",(d,w)->program()).show();}\n private void program(){if(busy||firmware==null||link==null)return;busy=true;stop.set(false);refresh();progress.setProgress(0);status.setText(\"正在准备…\");getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);FirmwareImage image=firmware;StLinkProtocol p=link;\n  worker.execute(()->{try{new F103Programmer(p).program(image,new F103Programmer.Monitor(){String last=\"\";public boolean cancelled(){return stop.get();}public void progress(String stage,int value){boolean changed=!stage.equals(last);last=stage;ui(()->{progress.setProgress(value);status.setText(stage+\" · \"+value+\"%\");if(changed)append(stage);});}});ui(()->{status.setText(\"写入与完整回读校验通过，已发送复位运行命令\");append(\"完成。下次操作请重新连接。\");});}catch(Exception e){ui(()->{status.setText(\"烧录未完成：\"+e.getMessage());append(\"失败：\"+e.getMessage());});}finally{closeUsb();ui(()->{busy=false;deviceInfo.setText(\"会话结束，请重新连接下载器\");getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);refresh();});}});\n }\n @Override protected void onDestroy(){destroyed=true;stop.set(true);if(registered)unregisterReceiver(receiver);worker.execute(this::closeUsb);worker.shutdown();super.onDestroy();}\n}\n",
          "app/src/main/java/cn/lei/sim8051/StLinkProtocol.java": "package cn.lei.sim8051;\n/** ST-LINK/V2 debug API v2. Protocol constants cross-checked against OpenOCD. */\npublic final class StLinkProtocol {\n public interface Transport {void send(byte[] b)throws Exception;byte[] receive(int size)throws Exception;}\n private final Transport io;public int jtag,swim;public String version=\"\",startup=\"\";\n public StLinkProtocol(Transport io){this.io=io;}\n private byte[] command(int size,int... args)throws Exception{byte[] c=new byte[16];for(int i=0;i<args.length;i++)c[i]=(byte)args[i];io.send(c);return size==0?new byte[0]:io.receive(size);}\n private static void status(byte[] r)throws Exception{if(r.length<1||(r[0]&255)!=0x80)throw new Exception(\"ST-Link 命令失败，状态 0x\"+(r.length==0?\"空\":Integer.toHexString(r[0]&255))+\"；检查接线、供电或重新连接\");}\n public static void put32(byte[] b,int p,int v){for(int i=0;i<4;i++)b[p+i]=(byte)(v>>>(8*i));}\n private byte[] addressed(int sub,int address,int length){byte[] c=new byte[16];c[0]=(byte)0xf2;c[1]=(byte)sub;put32(c,2,address);c[6]=(byte)length;c[7]=(byte)(length>>>8);return c;}\n public void open()throws Exception{\n  byte[] r=command(6,0xf1);int v=((r[0]&255)<<8)|(r[1]&255);int major=v>>>12;jtag=(v>>>6)&63;swim=v&63;version=\"V\"+major+\"J\"+jtag+\"S\"+swim;\n  if(major!=2)throw new Exception(\"仅适配 ST-Link V2，检测到 \"+version);\n  if(jtag<26)throw new Exception(version+\" 固件过旧；本版的半字写入要求 J26 或以上。请使用电脑官方工具更新支持的 ST-Link 固件\");\n  int mode=currentMode();startup=String.format(java.util.Locale.ROOT,\"初始模式 0x%02X\",mode);\n  if(mode==0){\n   // A V2 may initially report DFU. This command has no reply and does not flash firmware.\n   try{command(0,0xf3,0x07);for(int i=0;i<10;i++){Thread.sleep(50);mode=currentMode();if(mode!=0)break;}}\n   catch(Exception e){throw new Exception(version+\"：已尝试退出 DFU，USB 通讯未完成。若设备重新枚举，请再次点击连接；仍失败再重新插拔。详情：\"+e.getMessage(),e);}\n   if(mode==0)throw new Exception(version+\"：已发送退出 DFU 命令，但下载器仍报告模式 0x00；请重新插拔后连接，若持续失败再用电脑官方工具检查下载器\");\n   startup+=\" → 已退出 DFU\";\n  }\n  if(mode==2){command(0,0xf2,0x21);mode=currentMode();}\n  else if(mode==3){command(0,0xf4,0x01);mode=currentMode();}\n  if(mode!=1)throw new Exception(String.format(java.util.Locale.ROOT,\"%s：无法切换到待连接状态，模式 0x%02X；本版没有执行目标擦写\",version,mode));\n  status(command(2,0xf2,0x43,7,0)); // approximately 480 kHz, conservative SWD frequency\n  status(command(2,0xf2,0x30,0xa3));\n  mode=currentMode();if(mode!=2)throw new Exception(String.format(java.util.Locale.ROOT,\"%s：未进入 SWD 调试模式（0x%02X）\",version,mode));\n  startup+=\" → SWD 调试\";\n }\n private int currentMode()throws Exception{byte[] r=command(2,0xf5);if(r.length!=2)throw new Exception(\"ST-Link 模式响应长度错误\");return r[0]&255;}\n public int read32(int address)throws Exception{byte[] c=new byte[16];c[0]=(byte)0xf2;c[1]=0x36;put32(c,2,address);io.send(c);byte[] r=io.receive(8);status(r);return (int)FirmwareImage.u32(r,4);}\n public void write32(int address,int value)throws Exception{byte[] c=new byte[16];c[0]=(byte)0xf2;c[1]=0x35;put32(c,2,address);put32(c,6,value);io.send(c);status(io.receive(2));}\n private void rwStatus()throws Exception{status(command(12,0xf2,0x3e));}\n public byte[] read(int address,int length)throws Exception{if((address&3)!=0||length<4||(length&3)!=0||length>1024)throw new Exception(\"内部错误：读取对齐或长度\");io.send(addressed(7,address,length));byte[] r=io.receive(length);rwStatus();return r;}\n public void writeHalf(int address,int value)throws Exception{if((address&1)!=0)throw new Exception(\"内部错误：半字对齐\");io.send(addressed(0x48,address,2));io.send(new byte[]{(byte)value,(byte)(value>>>8)});rwStatus();}\n public void exit()throws Exception{command(0,0xf2,0x21);}\n}\n",
          "build.gradle": "plugins { id 'com.android.application' version '8.7.3' apply false }\n",
          "examples/keil_led.c": "/* Keil C51; select a standard 8051 with 128-byte IRAM. Enable Create HEX File. */\n#include <REG51.H>\n#include <intrins.h>\nvoid main(void) {\n    unsigned char pattern = 0xFE;\n    volatile unsigned int delay;\n    while (1) {\n        P1 = pattern;\n        for (delay = 0; delay < 30000U; delay++) { _nop_(); }\n        pattern = _crol_(pattern, 1);\n    }\n}\n",
          "examples/led.hex": ":0F00000074FEF5907E147FFFDFFEDEFA2380F39F\n:00000001FF\n",
          "examples/timer.hex": ":100000000200300000000000000000B2903200004A\n:1000100000000000000000000000000000000000E0\n:1000200000000000000000000000000000000000D0\n:1000300075890175A882D28C80FE00000000000046\n:00000001FF\n",
