          "settings.gradle": "pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = 'Sim8051'\ninclude ':app'\n",
          "tests/core.test.js": "'use strict';\nconst assert=require('node:assert/strict'),fs=require('node:fs'),path=require('node:path');\nconst {CPU8051,parseHex}=require('../app/src/main/assets/core.js');let tests=0;\nfunction test(name,f){f();tests++;console.log('PASS '+name)}\nfunction program(bytes){const c=new CPU8051();c.code.set(bytes);return c}\nfunction record(type,addr,data){const b=[data.length,addr>>8,addr&255,type,...data];return ':'+b.map(x=>x.toString(16).padStart(2,'0')).join('')+((-b.reduce((a,b)=>a+b,0))&255).toString(16).padStart(2,'0')+'\\n'}\nconst eof=record(1,0,[]);\ntest('HEX checksum, length, EOF, range and overlap validation',()=>{\n assert.equal(parseHex(record(0,0,[0x74,0xfe])+eof).code[1],254);\n assert.throws(()=>parseHex(':0200000074FE00\\n'+eof),/校验/);\n assert.throws(()=>parseHex(':0300000074FE8C\\n'+eof),/长度/);\n assert.throws(()=>parseHex(record(0,0,[0])),/EOF/);\n assert.throws(()=>parseHex(record(4,0,[0,1])+record(0,0,[1])+eof),/64KB/);\n assert.throws(()=>parseHex(record(0,0,[1])+record(0,0,[2])+eof),/冲突/);\n assert.throws(()=>parseHex(eof+record(0,0,[0])),/EOF/);\n});\ntest('Every standard opcode dispatches; reserved A5 rejected',()=>{\n for(let o=0;o<256;o++){const c=program([o,0,0]);if(o===0xa5)assert.throws(()=>c.step(),/操作码/);else assert.doesNotThrow(()=>c.step(),'opcode '+o.toString(16))}\n});\ntest('ADD/ADDC/SUBB exhaustive result, carry, auxiliary carry and signed overflow',()=>{\n const c=new CPU8051();for(let a=0;a<256;a++)for(let b=0;b<256;b++)for(let carry=0;carry<2;carry++){\n  c.a=a;c.add(b,carry);const sum=a+b+carry,sa=a<128?a:a-256,sb=b<128?b:b-256;\n  assert.equal(c.a,sum&255);assert.equal(c.c,Number(sum>255));assert.equal((c.read(0xd0)>>6)&1,Number((a&15)+(b&15)+carry>15));assert.equal((c.read(0xd0)>>2)&1,Number(sa+sb+carry>127||sa+sb+carry< -128));\n  c.a=a;c.c=carry;c.sub(b);const diff=a-b-carry;assert.equal(c.a,diff&255);assert.equal(c.c,Number(diff<0));assert.equal((c.read(0xd0)>>6)&1,Number((a&15)<(b&15)+carry));assert.equal((c.read(0xd0)>>2)&1,Number(sa-sb-carry>127||sa-sb-carry< -128));\n }\n});\ntest('Decimal adjust for all packed-BCD additions',()=>{const bcd=n=>(Math.floor(n/10)<<4)|(n%10);for(let a=0;a<100;a++)for(let b=0;b<100;b++)for(let cy=0;cy<2;cy++){const c=program([0xd4]);c.a=bcd(a);c.add(bcd(b),cy);c.step();assert.equal(c.a,bcd((a+b+cy)%100));assert.equal(c.c,Number(a+b+cy>=100));}});\ntest('Direct / indirect / register bank / bit addressing',()=>{\n const c=program([0x75,0xd0,0x08,0x78,0x30,0x76,0x55,0xe6,0xd2,0x00,0x85,0x30,0x31]);for(let i=0;i<6;i++)c.step();assert.equal(c.ram[8],0x30);assert.equal(c.ram[0x31],0x55);assert.equal(c.a,0x55);assert.equal(c.ram[0x20],1);\n c.code[0]=0x76;c.pc=0;c.wr(0,128);assert.throws(()=>c.step(),/128/);\n});\ntest('LCALL/RET stack ordering, AJMP page boundary, signed branch',()=>{\n const c=program([0x12,0,6,0x74,0x55,0,0x74,0x33,0x22]);c.step();assert.equal(c.pc,6);assert.equal(c.ram[8],3);assert.equal(c.ram[9],0);c.step();c.step();assert.equal(c.pc,3);c.step();assert.equal(c.a,0x55);\n c.pc=0x7fe;c.code[0x7fe]=1;c.code[0x7ff]=0x12;c.step();assert.equal(c.pc,0x812);\n c.pc=0;c.code.set([0x80,0xfe]);c.step();assert.equal(c.pc,0);\n});\ntest('MOVC and MOVX use distinct memory spaces',()=>{\n const c=program([0x90,0x12,0x34,0x74,0x56,0xf0,0xe4,0xe0]);for(let i=0;i<5;i++)c.step();assert.equal(c.a,0x56);assert.equal(c.xram[0x1234],0x56);assert.equal(c.code[0x1234],0);\n c.code.set([0x74,2,0x83,0,0,0xab]);c.pc=0;c.step();c.step();assert.equal(c.a,0xab);\n});\ntest('Timer modes 0/1/2 overflow and reload',()=>{\n for(let mode=0;mode<3;mode++){const c=new CPU8051();c.raw(0x89,mode);c.raw(0x88,16);c.raw(0x8c,mode===2?0xa0:255);c.raw(0x8a,255);c.tick(1);assert.ok(c.read(0x88)&32);assert.equal(c.read(0x8a),mode===2?0xa0:mode===0?0xe0:0);}\n});\ntest('Timer interrupt priority nesting and RETI',()=>{\n const c=new CPU8051();c.raw(0xa8,0x8a);c.raw(0xb8,8);c.raw(0x88,32);c.interrupt();assert.equal(c.pc,0x0b);assert.deepEqual(c.irq,[0]);c.raw(0x88,128);c.interrupt();assert.equal(c.pc,0x1b);assert.deepEqual(c.irq,[0,1]);c.code[0x1b]=0x32;c.step();assert.equal(c.pc,0x0b);assert.deepEqual(c.irq,[0]);c.code[0x0b]=0x32;c.step();assert.equal(c.pc,0);assert.deepEqual(c.irq,[]);\n});\ntest('End-to-end HEX LED sequence executes actual instructions',()=>{\n const c=new CPU8051();c.code.set(parseHex(fs.readFileSync(path.join(__dirname,'../examples/led.hex'),'utf8')).code);const seen=[];let old=255;for(let i=0;i<80000&&seen.length<8;i++){c.step();const p=c.read(0x90);if(p!==old){seen.push(p);old=p}}assert.deepEqual(seen,[254,253,251,247,239,223,191,127]);\n});\ntest('End-to-end HEX timer ISR toggles LED and returns',()=>{\n const c=new CPU8051();c.code.set(parseHex(fs.readFileSync(path.join(__dirname,'../examples/timer.hex'),'utf8')).code);for(let i=0;i<40000;i++)c.step();assert.equal(c.read(0x90),254);assert.equal(c.irq.length,0);\n});\ntest('Unsupported peripherals fail explicitly',()=>{const c=program([0x75,0x99,1]);assert.throws(()=>c.step(),/SFR/);c.raw(0x89,3);c.raw(0x88,16);assert.throws(()=>c.tick(1),/模式 3/);});\nconsole.log(`${tests} test groups passed`);\n",
          "tests/java/ProgrammerTest.java": "import cn.lei.sim8051.*;\nimport java.util.*;\nimport java.nio.charset.StandardCharsets;\npublic class ProgrammerTest {\n static int tests;\n static void check(boolean c,String m){if(!c)throw new AssertionError(m);}\n static void test(String name,Task t)throws Exception{t.run();tests++;System.out.println(\"PASS \"+name);}interface Task{void run()throws Exception;}\n static void fails(Task t,String part)throws Exception{try{t.run();throw new AssertionError(\"Expected failure: \"+part);}catch(AssertionError e){throw e;}catch(Exception e){check(e.getMessage().contains(part),e.toString());}}\n static byte[] image(){byte[] b=new byte[20];b[1]=0x18;b[3]=0x20;b[4]=9;b[7]=8;return b;}\n static String record(int type,int address,byte[] data){int sum=data.length+(address>>>8)+(address&255)+type;StringBuilder s=new StringBuilder(String.format(\":%02X%04X%02X\",data.length,address,type));for(byte b:data){sum+=b&255;s.append(String.format(\"%02X\",b&255));}return s.append(String.format(\"%02X\\n\",(-sum)&255)).toString();}\n static final class Fake implements StLinkProtocol.Transport {\n  byte[] flash=new byte[FirmwareImage.SIZE];Map<Integer,Integer> regs=new HashMap<>();byte[] cmd;boolean dataPhase;int address,eraseCount,writeCount,versionJ=26,failAfter=-1,mode=1;List<byte[]> sent=new ArrayList<>();boolean forcedReadMismatch,stuckDfu,stuckDebug,failModeAfterExit,dfuExited;\n  Fake(){Arrays.fill(flash,(byte)0);regs.put(0xe0042000,0x412);regs.put(0xe000ed00,0x410fc231);regs.put(0x1ffff7e0,16);regs.put(0x4002201c,4);regs.put(F103Programmer.CR,128);}\n  int get(int a){return regs.getOrDefault(a,0);}\n  void set(int a,int v){if(a==F103Programmer.SR){regs.put(a,get(a)&~v);return;}if(a==0x40022004){if(v==0xcdef89ab)regs.put(F103Programmer.CR,0);return;}if(a==0x40021000)v|=2;\n   if(a==F103Programmer.DHCSR){v=(v&2)!=0?v|(1<<17):v&~(1<<17);}\n   if(a==F103Programmer.AIRCR){regs.put(F103Programmer.DHCSR,(get(F103Programmer.DEMCR)&1)!=0?0x20003:1);}\n   regs.put(a,v);\n   if(a==F103Programmer.CR&&(v&0x42)==0x42){int p=get(0x40022014)-FirmwareImage.BASE;check(p>=0&&p+1024<=flash.length,\"erase range\");Arrays.fill(flash,p,p+1024,(byte)255);eraseCount++;}\n  }\n  public void send(byte[] b)throws Exception{sent.add(b.clone());if(dataPhase){dataPhase=false;check(b.length==2,\"halfword payload length\");check((get(F103Programmer.CR)&1)!=0,\"PG bit not set\");if(failAfter>=0&&writeCount>=failAfter)throw new Exception(\"injected USB failure\");int p=address-FirmwareImage.BASE;check(p>=0&&p+2<=flash.length,\"write range\");flash[p]=b[0];flash[p+1]=b[1];writeCount++;return;}check(b.length==16,\"16-byte command\");cmd=b.clone();int op=cmd[0]&255,sub=cmd[1]&255;\n   if(op==0xf3&&sub==7){dfuExited=true;if(!stuckDfu)mode=1;}\n   if(op==0xf2&&sub==0x21&&!stuckDebug)mode=1;\n   if(op==0xf4&&sub==0x01)mode=1;\n   if(op==0xf2&&sub==0x30){check(mode==1,\"SWD enter must follow idle\");mode=2;}\n   if(op==0xf2&&sub==0x43)check(mode==1,\"frequency must follow idle\");\n   if((cmd[0]&255)==0xf2&&(cmd[1]&255)==0x48){address=(int)FirmwareImage.u32(cmd,2);check((address&1)==0&&cmd[6]==2&&cmd[7]==0,\"halfword command\");dataPhase=true;}if((cmd[0]&255)==0xf2&&(cmd[1]&255)==0x35)set((int)FirmwareImage.u32(cmd,2),(int)FirmwareImage.u32(cmd,6));}\n  public byte[] receive(int len)throws Exception{byte[] r=new byte[len];int a=cmd[0]&255,s=cmd[1]&255;\n   if(a==0xf1){int version=2<<12|versionJ<<6;r[0]=(byte)(version>>8);r[1]=(byte)version;}\n   else if(a==0xf5){if(failModeAfterExit&&dfuExited)throw new Exception(\"USB disconnected\");r[0]=(byte)mode;}\n   else if(a==0xf2&&s==0x36){r[0]=(byte)128;StLinkProtocol.put32(r,4,get((int)FirmwareImage.u32(cmd,2)));}\n   else if(a==0xf2&&s==7){int p=(int)FirmwareImage.u32(cmd,2)-FirmwareImage.BASE;System.arraycopy(flash,p,r,0,len);if(forcedReadMismatch&&writeCount>0)r[0]^=1;}\n   else r[0]=(byte)128;return r;\n  }\n }\n static void noTargetWrites(Fake f){check(f.eraseCount==0&&f.writeCount==0,\"no target flash writes\");for(byte[] c:f.sent)check(!((c[0]&255)==0xf2&&(c[1]&255)==0x35),\"no target register writes\");}\n static StLinkProtocol open(Fake f)throws Exception{StLinkProtocol p=new StLinkProtocol(f);p.open();return p;}\n static F103Programmer.Monitor monitor(Fake f,boolean cancel){return new F103Programmer.Monitor(){int previous=-1;public boolean cancelled(){return cancel;}public void progress(String s,int v){check(v>=previous&&v<=100,\"progress monotonic\");previous=v;}};}\n public static void main(String[] args)throws Exception{\n  test(\"BIN vector validation, padding and page plan\",()->{FirmwareImage f=FirmwareImage.parse(image(),\"a.bin\");check(f.bytes==20&&f.pageCount()==1,\"plan\");check((f.data[21]&255)==255,\"padding\");byte[] badSp=image();badSp[2]=1;fails(()->FirmwareImage.parse(badSp,\"a.bin\"),\"栈地址\");byte[] badPc=image();badPc[4]=8;fails(()->FirmwareImage.parse(badPc,\"a.bin\"),\"复位入口\");});\n  test(\"HEX extended address, checksum, EOF and bounds\",()->{String hex=record(4,0,new byte[]{8,0})+record(0,0,image())+record(5,0,new byte[]{8,0,0,9})+record(1,0,new byte[0]);check(FirmwareImage.parse(hex.getBytes(StandardCharsets.UTF_8),\"test.hex\").bytes==20,\"HEX image\");fails(()->FirmwareImage.parse(hex.replace(\":020000040800F2\",\":02000004080000\").getBytes(StandardCharsets.UTF_8),\"a.hex\"),\"校验和\");String bad=record(4,0,new byte[]{8,1})+record(0,0,image())+record(1,0,new byte[0]);fails(()->FirmwareImage.parse(bad.getBytes(StandardCharsets.UTF_8),\"a.hex\"),\"超出\");fails(()->FirmwareImage.parse(record(4,0,new byte[]{8,0}).getBytes(StandardCharsets.UTF_8),\"a.hex\"),\"EOF\");});\n  test(\"ST-Link minimum firmware guard\",()->{Fake f=new Fake();f.versionJ=25;fails(()->open(f),\"过旧\");check(f.eraseCount==0,\"no erase\");});\n  test(\"DFU startup exits with F3/07 and enters SWD without target writes\",()->{Fake f=new Fake();f.mode=0;StLinkProtocol p=open(f);check(f.dfuExited&&f.mode==2,\"DFU exit then SWD\");check(p.startup.contains(\"已退出 DFU\"),\"diagnostics\");noTargetWrites(f);});\n  test(\"Existing debug and SWIM modes exit before SWD entry\",()->{for(int mode:new int[]{2,3}){Fake f=new Fake();f.mode=mode;open(f);check(f.mode==2&&!f.dfuExited,\"SWD entry\");noTargetWrites(f);}});\n  test(\"Persistent DFU stops before target writes or SWD entry\",()->{Fake f=new Fake();f.mode=0;f.stuckDfu=true;fails(()->open(f),\"仍报告模式\");check(f.mode==0&&f.dfuExited,\"DFU still present\");noTargetWrites(f);});\n  test(\"USB re-enumeration after DFU exit gives reconnect guidance\",()->{Fake f=new Fake();f.mode=0;f.failModeAfterExit=true;fails(()->open(f),\"再次点击连接\");noTargetWrites(f);});\n  test(\"Bootloader and unknown modes rejected without a DFU exit\",()->{for(int mode:new int[]{4,255}){Fake f=new Fake();f.mode=mode;fails(()->open(f),\"待连接状态\");check(!f.dfuExited,\"no DFU command\");noTargetWrites(f);}});\n  test(\"Failed debug exit never proceeds to SWD\",()->{Fake f=new Fake();f.mode=2;f.stuckDebug=true;fails(()->open(f),\"待连接状态\");noTargetWrites(f);});\n  test(\"Target mismatch and protection guards\",()->{Fake f=new Fake();StLinkProtocol p=open(f);f.regs.put(0xe0042000,0x410);fails(()->new F103Programmer(p).identify(),\"目标不匹配\");f.regs.put(0xe0042000,0x412);f.regs.put(0x4002201c,6);fails(()->new F103Programmer(p).identify(),\"读保护\");check(f.eraseCount==0,\"no erase\");});\n  test(\"Full erase/write/readback sequence; untouched pages preserved\",()->{Fake f=new Fake();FirmwareImage img=FirmwareImage.parse(image(),\"a.bin\");new F103Programmer(open(f)).program(img,monitor(f,false));check(f.eraseCount==1&&f.writeCount>0,\"actual commands\");check(Arrays.equals(Arrays.copyOf(f.flash,1024),Arrays.copyOf(img.data,1024)),\"readback image\");check(f.flash[1024]==0,\"untouched page\");check((f.get(F103Programmer.CR)&128)!=0,\"locked\");check((f.get(F103Programmer.DHCSR)&(1<<17))==0,\"runs after verify\");for(byte[] c:f.sent)if(c.length==16&&(c[0]&255)==0xf2&&(c[1]&255)==0x35){int addr=(int)FirmwareImage.u32(c,2);check(addr!=0x40022008,\"no option-key writes\");}});\n  test(\"Cancelled operation never erases\",()->{Fake f=new Fake();fails(()->new F103Programmer(open(f)).program(FirmwareImage.parse(image(),\"a.bin\"),monitor(f,true)),\"停止\");check(f.eraseCount==0,\"cancel before erase\");});\n  test(\"Transport failure relocks flash, leaves target halted\",()->{Fake f=new Fake();f.failAfter=1;fails(()->new F103Programmer(open(f)).program(FirmwareImage.parse(image(),\"a.bin\"),monitor(f,false)),\"injected\");check((f.get(F103Programmer.CR)&128)!=0,\"failure lock\");check((f.get(F103Programmer.DHCSR)&(1<<17))!=0,\"failure halt\");});\n  test(\"Readback mismatch prevents reboot\",()->{Fake f=new Fake();f.forcedReadMismatch=true;fails(()->new F103Programmer(open(f)).program(FirmwareImage.parse(image(),\"a.bin\"),monitor(f,false)),\"回读校验失败\");check((f.get(F103Programmer.DHCSR)&(1<<17))!=0,\"mismatch halt\");});\n  test(\"C8 accepts 20KB RAM and 64KB Flash, rejects both upper bounds\",()->{byte[] b=Arrays.copyOf(image(),65536);b[1]=0x50;FirmwareImage f=FirmwareImage.parse(b,\"c8.bin\",ChipTarget.C8);check(f.data.length==65536&&f.pages.length==64&&f.pageCount()==64,\"C8 geometry\");fails(()->FirmwareImage.parse(Arrays.copyOf(b,65537),\"c8.bin\",ChipTarget.C8),\"BIN 必须\");byte[] bad=b.clone();bad[0]=4;fails(()->FirmwareImage.parse(bad,\"c8.bin\",ChipTarget.C8),\"栈地址\");fails(()->FirmwareImage.parse(b,\"r4.bin\",ChipTarget.R4),\"BIN 必须\");String hex=record(4,0,new byte[]{8,1})+record(0,0,new byte[]{1})+record(1,0,new byte[0]);fails(()->FirmwareImage.parse(hex.getBytes(StandardCharsets.UTF_8),\"c8.hex\",ChipTarget.C8),\"超出\");});\n  test(\"C8 sparse image programs above 16KB through final 64KB page\",()->{Fake f=new Fake();f.flash=new byte[65536];f.regs.put(0xe0042000,0x410);f.regs.put(0x1ffff7e0,64);byte[] b=image();b[1]=0x50;String hex=record(4,0,new byte[]{8,0})+record(0,0,b)+record(0,0xfffe,new byte[]{0x12,0x34})+record(1,0,new byte[0]);FirmwareImage img=FirmwareImage.parse(hex.getBytes(StandardCharsets.UTF_8),\"c8.hex\",ChipTarget.C8);new F103Programmer(open(f)).program(img,monitor(f,false));check(f.eraseCount==2,\"only two pages\");check(f.flash[65534]==0x12&&f.flash[65535]==0x34,\"last halfword programmed\");check(f.flash[1024]==0,\"middle page untouched\");check(Arrays.equals(Arrays.copyOfRange(f.flash,64512,65536),Arrays.copyOfRange(img.data,64512,65536)),\"last page readback\");});\n  test(\"Selected C8/R4 profiles reject mismatched ID and capacity before erase\",()->{Fake f=new Fake();FirmwareImage c8=FirmwareImage.parse(image(),\"c8.bin\",ChipTarget.C8);fails(()->new F103Programmer(open(f)).program(c8,monitor(f,false)),\"目标不匹配\");f.regs.put(0xe0042000,0x410);f.regs.put(0x1ffff7e0,128);fails(()->new F103Programmer(open(f)).program(c8,monitor(f,false)),\"目标不匹配\");f.regs.put(0x1ffff7e0,64);fails(()->new F103Programmer(open(f)).program(FirmwareImage.parse(image(),\"r4.bin\"),monitor(f,false)),\"目标不匹配\");check(f.eraseCount==0&&f.writeCount==0,\"no mismatched writes\");});\n  System.out.println(tests+\" Java test groups passed; mocked USB only, no physical hardware certification.\");\n }\n}\n"
        }''')
