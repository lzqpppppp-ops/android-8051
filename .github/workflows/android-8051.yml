# Upload this ONE file to .github/workflows/android-8051.yml
name: Build 8051 Android
'on':
  workflow_dispatch: {}
  push:
    paths:
    - .github/workflows/android-8051.yml
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Generate self-contained Android project
      run: |
        python3 - <<'PY_SOURCE'
        import json
        from pathlib import Path
        files=json.loads(r'''{
          "README.md": "# MCU 实验台 0.2（安卓验证版）\n\n## 单文件 GitHub 编译\n把交付的 `android-8051.yml` 放在仓库 `.github/workflows/android-8051.yml`。\n工作流内嵌项目全部源码，不要求另外上传 Android 工程，不需要配置 API 密钥。\n进入 Actions → Build 8051 Android → Run workflow。\n成功后在该次运行底部 Artifacts 下载 `8051-Android-debug`，解压安装 `app-debug.apk`。\n另一个产物 `8051-source-and-examples` 包含源代码、示例 HEX、Keil C51 测试源码和说明。\n仓库开启 Actions 才能运行；公开/私有仓库用量取决于你的 GitHub 账户。\n如仓库已有其他 Android 工作流，可单独运行本工作流；不需要覆盖旧项目文件。\n自动生成目录为 `_sim8051_generated`。请勿把手写源码放在这个专用目录里。\n\n## 手机上怎么验证\n1. 安装 APK（Android 8.0 及以上）。\n2. 点击“流水灯示例”→“运行”。P1.0 至 P1.7 依次点亮。\n3. 点击“定时器示例”→“运行”。P1.0 周期闪烁，其他灯灭。\n4. 暂停、单步，观察 PC、A、PSW、SP 和定时器值；复位保留程序。\n5. Keil C51 选择标准 8051，Options for Target → Output 勾选 Create HEX File，重新构建。\n6. 导入自己的 `.hex`。首个测试推荐 `examples/keil_led.c`。\n7. 选择 P0/P1/P2/P3 可以切换 LED 观察端口；LED 默认低电平点亮。\n切到后台自动暂停。关闭应用后需重新导入；本版不自动保存项目。\n\n## 已实现范围\n- 可扩展的主控选择入口，当前只有标准 8051（128 字节 IRAM、12T）。\n- 标准指令解释执行（保留码 A5 明确报错）、4 个寄存器组、位寻址。\n- 64KB 程序存储、64KB 逻辑 XRAM（MOVX）；XRAM 仅为验证方便，不模拟外部总线。\n- Intel HEX 校验和、记录长度、EOF、越界、冲突重叠检查。支持数据/EOF/段地址/线性地址记录。\n- T0/T1 内部定时模式 0/1/2，TF 标志和两级优先级定时器中断、RETI。\n- 固定 LED 数字实验板、速度选择、运行/暂停/单步/复位、寄存器及 RAM 显示。\n- Android 原生文件选择器；应用不申请联网或全盘存储权限。\n\n## 限制（避免误判兼容性）\n这是原型，不是 Labcenter Proteus 产品，也不兼容 Proteus 工程。\n未实现自由布线、模拟电路求解、UART、外部中断、外部计数、GATE、T0 模式3、低功耗模式、8052/STC 扩展外设。\n对不支持的 SFR 访问及上述部分配置明确停止报错。\n端口按逻辑锁存值显示，不模拟引脚电气特性、外部负载、读引脚与读锁存的差别。\n程序存储未写入区域填充 FF。HEX 本身不能证明目标型号匹配；用户需确认是标准 8051 代码。\n8051 仿真入口不支持 AXF、ELF、目标文件或 STM32/ARM HEX，不提供 C 源级单步调试。\n中断采样在指令边界，未实现真实芯片全部采样延迟；不是周期精确认证模型。\n速度是目标机器周期吞吐，低性能手机可能达不到设定速度。\n\n## 验证记录\n本地 Node.js：12 组测试通过，包括穷举 ADD/ADDC/SUBB 结果与标志、BCD 调整、\n所有标准操作码的派发检查、HEX 错误、寻址、调用栈、MOVC/MOVX、定时器、\n嵌套优先级中断、实际执行流水灯和定时器 HEX。\n“所有操作码派发检查”不是每条指令的穷举正确性认证。\n内置 HEX 为手工生成的 8051 机器码，不是声称由 Keil 编译的文件。\nKeil C51 示例源码尚未在本环境使用 Keil 编译，需你的实际 HEX 做兼容性验收。\n当前环境没有 Android SDK/Gradle 和可运行浏览器，尚未完成 APK 编译、手机实测、页面视觉验收。\nGitHub 工作流会重新运行内核测试，再执行 assembleDebug；构建结果以 Actions 日志为准。\n\n## 技术结构\n原生 Java Activity + 离线 WebView UI + JavaScript 指令解释器。\n本地 HTTPS 资源通过 WebViewClient 从打包 assets 提供，不访问网络。\n与真实 CPU 无关，手机不需要 root 或终端。\nGitHub：JDK17、AGP8.7.3、Gradle8.9、compile/targetSdk35、minSdk26。\nAPK 为 debug 签名，适合验证；不同构建的调试签名可能不同，若提示签名冲突需卸载旧版。\n\n## 参考规格\n- Keil 指令参考：https://www.keil.com/support/man/docs/is51/is51_instructions.asp\n- Keil HEX 格式：https://www.keil.com/support/docs/1584/_hlp_hexfile.htm\n- Android AGP 兼容：https://developer.android.com/build/releases/agp-8-7-0-release-notes\n\n## STM32F103R4 实物烧录（新增）\n这里的 STM32 功能是对真实芯片烧录，不包含 STM32 软件仿真。\nAndroid USB Host 原生代码直接与独立 ST-Link V2 通讯，不需要 root、终端、联网服务或 API 密钥。\n只接受 USB VID:PID 0483:3748 的独立 V2；不支持 V1、V2-1 或 V3。\n下载器固件必须 V2J26 或更新的 J 版本（16-bit memory write 指令要求）；旧固件会拒绝连接。\n仿制下载器是否兼容，需要实际验证。\n\n### 接线与使用\n1. 手机支持 USB OTG，USB-C OTG 转接头连接 ST-Link V2。\n2. ST-Link SWDIO 接 PA13，SWCLK 接 PA14，GND 接目标板 GND；BOOT0 保持 0。\n3. 目标板必须正确供电。按下载器的说明区分电压参考引脚与电源输出，避免两个电源互相供电；不要把 5V 接到 MCU 的 3.3V 电源。\n4. 打开应用主页“STM32 实物烧录”，连接下载器并允许 USB 权限。\n5. 选择 Keil 为 STM32F103R4 编译生成的 HEX 或 BIN，检查后点击烧录并确认。\n6. 应用擦除文件涉及的 1KB 页、逐半字写入，完整回读这些页校验，成功后发送复位运行命令。\n7. 会话结束后关闭 USB；再次烧录先重新连接。\n\n### 文件与芯片限制\n- R4：16KB Flash（0x08000000–0x08003FFF），6KB SRAM（0x20000000–0x200017FF）。\n- Keil 工程 IROM1 起始 0x08000000，大小 0x4000；IRAM1 起始 0x20000000，大小 0x1800。\n- HEX 支持标准 Intel HEX 地址记录和校验；BIN 固定加载到 0x08000000。必须包含有效初始栈和复位向量。\n- 只接受独立应用镜像；不支持偏移启动、bootloader 分区、AXF/ELF、任意地址写入或 RAM 镜像。\n- MCU ID 0x412、Cortex-M3 和 Flash 容量检查不能单独证明具体型号与封装，请核对芯片丝印为 STM32F103R4。\n- 只擦除涉及的页；同一页里文件未包含的旧数据会变为 FF。其他页保留。\n- 不解除读保护，不修改选项字节。受保护目标拒绝操作。\n- 不支持 connect-under-reset、NRST 控制或自动固件升级；若旧程序关闭 SWD、进入低功耗等导致连接失败，需要用桌面工具恢复。\n- 停止、断线或写入失败可能留下部分程序；必须重新完整烧录后才能正常使用。\n- 应用运行是否正确仍取决于项目的启动代码、时钟、引脚和板级硬件；回读一致不代表程序功能已验证。\n\n### 验证记录\n烧录核心经 JDK17 编译，17 组模拟 USB/Flash 测试通过：文件校验、固件门槛、目标/保护检查、完整擦写回读、未涉及页保留、取消、传输异常和回读失败。\n这些测试不替代真实手机与下载器测试。当前环境未完成 APK 编译或真实 STM32 烧录；Actions 将执行 Java 测试和 assembleDebug。\n\n### 参考\n- STM32F103x4/x6 数据手册：https://www.st.com/resource/en/datasheet/stm32f103c6.pdf\n- STM32F1 Flash PM0075：https://www.st.com/resource/en/programming_manual/pm0075-stm32f10xxx-flash-memory-microcontrollers-stmicroelectronics.pdf\n- ST-Link 协议交叉核对：https://github.com/openocd-org/openocd/blob/master/src/jtag/drivers/stlink_usb.c\n\n## 0.2.1 连接修复\n旧版把 ST-Link V2 报告 DFU 模式直接判为固件恢复问题。现连接流程会发送无响应的 F3/07 退出命令，等待并复查模式，然后进入 SWD。此命令不升级下载器固件，也不擦写目标 Flash。\n同时处理已有 DEBUG/SWIM 会话，检查待连接状态和 SWD 状态。若退出时 USB 重新枚举导致会话断开，请再次点击连接并授权。持续处于 DFU 才提示用桌面工具检查。\n新增 6 组模拟测试覆盖上述启动状态、持续 DFU 和退出期间断线；尚无真实下载器实测。\n\n## 0.2.2：STM32F103C8T6\n烧录页默认选择 C8T6，同时保留 R4 选项。切换型号会清除已选镜像并关闭 USB 会话，需重新连接和导入。\nC8T6 目标检查：ID 0x410、Cortex-M3、64KB Flash；RAM 向量检查按 20KB。不会因部分芯片能访问更多空间而开放 128KB。\nC8T6 Keil 设置：IROM1 起始 0x08000000，大小 0x10000；IRAM1 起始 0x20000000，大小 0x5000。HEX/BIN 必须为该目标编译。\nC8T6 Flash 地址：0x08000000–0x0800FFFF；SRAM 地址：0x20000000–0x20004FFF。擦除页仍为 1KB。\n新增 3 组模拟测试：64KB/20KB 边界、超出原 16KB 的末页写入和回读、型号/容量不匹配停止。仍需真实手机与目标板验收。\n数据手册：https://www.st.com/resource/en/datasheet/stm32f103c8.pdf\n",
          "app/build.gradle": "plugins { id 'com.android.application' }\nandroid {\n namespace 'cn.lei.sim8051'\n compileSdk 35\n defaultConfig { applicationId 'cn.lei.sim8051'; minSdk 26; targetSdk 35; versionCode 4; versionName '0.2.2-stlink' }\n compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n}\n",
          "app/src/main/AndroidManifest.xml": "<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"><uses-feature android:name=\"android.hardware.usb.host\" android:required=\"false\"/><application android:label=\"8051实验台\" android:theme=\"@android:style/Theme.Material.NoActionBar\" android:allowBackup=\"false\" android:supportsRtl=\"true\"><activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\"><intent-filter><action android:name=\"android.intent.action.MAIN\"/><category android:name=\"android.intent.category.LAUNCHER\"/></intent-filter></activity><activity android:name=\".ProgrammerActivity\" android:exported=\"false\"/></application></manifest>\n",
          "app/src/main/assets/core.js": "'use strict';\n// Original educational MCS-51 interpreter. Instruction-boundary timing, not bus-cycle simulation.\nclass CPU8051 {\n  constructor(){this.code=new Uint8Array(65536);this.reset();}\n  reset(){this.ram=new Uint8Array(128);this.sfr=new Uint8Array(128);this.xram=new Uint8Array(65536);this.pc=0;this.cycles=0;this.steps=0;this.irq=[];this.sfr[1]=7;for(const p of [0x80,0x90,0xa0,0xb0])this.sfr[p-128]=255;}\n  read(d){if(d>=128&&!CPU8051.sfrs.has(d))throw Error('暂不支持 SFR 0x'+d.toString(16));return d<128?this.ram[d]:this.sfr[d-128];}\n  write(d,v){if(d>=128&&!CPU8051.sfrs.has(d))throw Error('暂不支持 SFR 0x'+d.toString(16));if(d===0x87&&(v&3))throw Error('暂不支持 IDLE/掉电模式');this.raw(d,v);}\n  raw(d,v){if(d<128)this.ram[d]=v&255;else this.sfr[d-128]=v&255;}\n  indirect(d){if(d>127)throw Error('标准 8051 只有 128 字节内部 RAM；请勿选择 8052/STC 扩展内存');return this.ram[d];}\n  putIndirect(d,v){this.indirect(d);this.ram[d]=v&255;}\n  get a(){return this.read(0xe0)} set a(v){this.raw(0xe0,v)}\n  get c(){return this.read(0xd0)>>>7} set c(v){this.flag(7,v)}\n  get dptr(){return this.read(0x83)*256+this.read(0x82)} set dptr(v){this.raw(0x82,v);this.raw(0x83,v>>>8)}\n  flag(n,v){this.raw(0xd0,(this.read(0xd0)&~(1<<n))|(v?1<<n:0))}\n  reg(n){return ((this.read(0xd0)>>>3)&3)*8+n;}\n  r(n){return this.ram[this.reg(n)]} wr(n,v){this.ram[this.reg(n)]=v&255}\n  bit(b){return (this.read(b<128?0x20+(b>>>3):b&0xf8) >>> (b&7))&1}\n  wb(b,v){const d=b<128?0x20+(b>>>3):b&0xf8;this.write(d,(this.read(d)&~(1<<(b&7)))|(v?1<<(b&7):0))}\n  fetch(){const v=this.code[this.pc];this.pc=(this.pc+1)&65535;return v}\n  rel(v){this.pc=(this.pc+(v<128?v:v-256))&65535}\n  push(v){const s=(this.read(0x81)+1)&255;this.putIndirect(s,v);this.raw(0x81,s)}\n  pop(){const s=this.read(0x81),v=this.indirect(s);this.raw(0x81,s-1);return v}\n  call(addr){this.push(this.pc&255);this.push(this.pc>>>8);this.pc=addr}\n  ret(){const h=this.pop();this.pc=(h<<8)|this.pop()}\n  operand(o){const n=o&15;if(n===4)return this.fetch();if(n===5)return this.read(this.fetch());if(n<8)return this.indirect(this.r(n&1));return this.r(n&7)}\n  add(v,carry=0){const a=this.a,s=a+v+carry;this.c=s>255;this.flag(6,((a&15)+(v&15)+carry)>15);this.flag(2,(~(a^v)&(a^s)&128)!==0);this.a=s}\n  sub(v){const a=this.a,c=this.c,s=a-v-c;this.c=s<0;this.flag(6,(a&15)<(v&15)+c);this.flag(2,((a^v)&(a^s)&128)!==0);this.a=s}\n  tick(n){\n    for(let t=0;t<2;t++){\n      const shift=t*4,config=(this.read(0x89)>>>shift)&15,mode=config&3;\n      if(!(this.read(0x88)&(t?64:16)))continue;\n      if(config&12)throw Error('验证版仅支持内部定时：TMOD 的 GATE、C/T 必须为 0');\n      if(mode===3)throw Error('验证版暂不支持定时器模式 3');\n      const lo=0x8a+t,hi=0x8c+t;\n      for(let k=0;k<n;k++){\n        let v,overflow=false;\n        if(mode===2){v=this.read(lo)+1;overflow=v>255;this.raw(lo,overflow?this.read(hi):v)}\n        else if(mode===1){v=(this.read(hi)*256+this.read(lo)+1);overflow=v>65535;this.raw(lo,v);this.raw(hi,v>>>8)}\n        else{v=(this.read(hi)*32+(this.read(lo)&31)+1);overflow=v>8191;this.raw(lo,(this.read(lo)&224)|(v&31));this.raw(hi,v>>>5)}\n        if(overflow)this.raw(0x88,this.read(0x88)|(t?128:32));\n      }\n    }\n    this.cycles+=n;\n  }\n  interrupt(){\n    const ie=this.read(0xa8);if(!(ie&128))return;\n    if(ie&0x15)throw Error('验证版仅实现 T0/T1 中断；请关闭外部中断与串口中断');\n    const current=this.irq.length?this.irq[this.irq.length-1]:-1;\n    for(let priority=1;priority>=0;priority--)for(const [enable,flag,vector] of [[2,32,0x0b],[8,128,0x1b]]){\n      if(priority<=current||!(ie&enable)||!(this.read(0x88)&flag)||Number(!!(this.read(0xb8)&enable))!==priority)continue;\n      this.raw(0x88,this.read(0x88)&~flag);this.irq.push(priority);this.call(vector);this.tick(2);return;\n    }\n  }\n  step(){\n    const address=this.pc,o=this.fetch();let d,v,b,r,n=1;\n    if((o&31)===1){v=this.fetch();this.pc=(this.pc&0xf800)|((o&0xe0)<<3)|v;n=2;}\n    else if((o&31)===17){v=this.fetch();this.call((this.pc&0xf800)|((o&0xe0)<<3)|v);n=2;}\n    else if(o>=0x08&&o<=0x0f)this.wr(o&7,this.r(o&7)+1);\n    else if(o>=0x18&&o<=0x1f)this.wr(o&7,this.r(o&7)-1);\n    else if(o>=0x24&&o<=0x2f)this.add(this.operand(o));\n    else if(o>=0x34&&o<=0x3f)this.add(this.operand(o),this.c);\n    else if(o>=0x44&&o<=0x4f)this.a=this.a|this.operand(o);\n    else if(o>=0x54&&o<=0x5f)this.a=this.a&this.operand(o);\n    else if(o>=0x64&&o<=0x6f)this.a=this.a^this.operand(o);\n    else if(o>=0x78&&o<=0x7f)this.wr(o&7,this.fetch());\n    else if(o>=0x88&&o<=0x8f){d=this.fetch();this.write(d,this.r(o&7));n=2;}\n    else if(o>=0x94&&o<=0x9f)this.sub(this.operand(o));\n    else if(o>=0xa8&&o<=0xaf){this.wr(o&7,this.read(this.fetch()));n=2;}\n    else if(o>=0xb8&&o<=0xbf){v=this.fetch();r=this.fetch();this.c=this.r(o&7)<v;if(this.r(o&7)!==v)this.rel(r);n=2;}\n    else if(o>=0xc8&&o<=0xcf){v=this.r(o&7);this.wr(o&7,this.a);this.a=v;}\n    else if(o>=0xd8&&o<=0xdf){r=this.fetch();this.wr(o&7,this.r(o&7)-1);if(this.r(o&7))this.rel(r);n=2;}\n    else if(o>=0xe8&&o<=0xef)this.a=this.r(o&7);\n    else if(o>=0xf8)this.wr(o&7,this.a);\n    else switch(o){\n      case 0x00:break;\n      case 0x02:v=this.fetch();this.pc=(v<<8)|this.fetch();n=2;break;\n      case 0x03:this.a=(this.a>>>1)|(this.a<<7);break;\n      case 0x04:this.a++;break;\n      case 0x05:d=this.fetch();this.write(d,this.read(d)+1);break;\n      case 0x06:case 0x07:d=this.r(o&1);this.putIndirect(d,this.indirect(d)+1);break;\n      case 0x10:b=this.fetch();r=this.fetch();if(this.bit(b)){this.wb(b,0);this.rel(r)}n=2;break;\n      case 0x12:v=this.fetch();d=(v<<8)|this.fetch();this.call(d);n=2;break;\n      case 0x13:v=this.c;this.c=this.a&1;this.a=(this.a>>>1)|(v<<7);break;\n      case 0x14:this.a--;break;\n      case 0x15:d=this.fetch();this.write(d,this.read(d)-1);break;\n      case 0x16:case 0x17:d=this.r(o&1);this.putIndirect(d,this.indirect(d)-1);break;\n      case 0x20:case 0x30:b=this.fetch();r=this.fetch();if(this.bit(b)===(o===0x20?1:0))this.re